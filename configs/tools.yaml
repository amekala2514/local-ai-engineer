version: 1

# Tool registry. Each tool the model can call is defined here with
# its schema and risk tier. The Agent API reads this to decide what
# tools to expose to the model.

tools:
  # Example structure; real tools added in Phase 2

  - name: read_file
    description: Read the contents of a file within the workspace
    risk_tier: low
    parameters:
      path:
        type: string
        description: Absolute path to the file
        required: true
    enabled: false
