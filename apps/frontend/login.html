<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Local AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { overflow: auto; height: auto; }
  </style>
</head>
<body>
  <div class="login-container">
    <article>
      <hgroup>
        <h2>Local AI Assistant</h2>
        <p>Sign in to continue</p>
      </hgroup>

      <form id="login-form">
        <label for="token-input">
          Bearer token
          <input
            type="password"
            id="token-input"
            name="token"
            placeholder="Paste your token"
            autocomplete="current-password"
            required>
          <small>From your <code>.env</code> file. Stored as a session cookie.</small>
        </label>

        <button type="submit" id="login-button">Sign in</button>
        <p id="login-error" class="error-text" hidden></p>
      </form>
    </article>
  </div>

  <script>
    // Pick up theme preference
    const saved = localStorage.getItem('theme');
    if (saved === 'dark' || saved === 'light') {
      document.documentElement.dataset.theme = saved;
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.dataset.theme = 'dark';
    }

    const form = document.getElementById('login-form');
    const tokenInput = document.getElementById('token-input');
    const loginButton = document.getElementById('login-button');
    const errorEl = document.getElementById('login-error');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorEl.hidden = true;
      loginButton.disabled = true;
      loginButton.setAttribute('aria-busy', 'true');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ token: tokenInput.value.trim() }),
        });

        if (res.ok) {
          window.location.href = '/';
          return;
        }

        const data = await res.json().catch(() => ({}));
        errorEl.textContent = data.detail || `Sign-in failed (HTTP ${res.status})`;
        errorEl.hidden = false;
      } catch (e) {
        errorEl.textContent = `Network error: ${e.message}`;
        errorEl.hidden = false;
      } finally {
        loginButton.disabled = false;
        loginButton.removeAttribute('aria-busy');
      }
    });

    tokenInput.focus();
  </script>
</body>
</html>
